{% extends "base.html" %}
{%block title%}Вход{%endblock%}
{% block content %}
<style>
  .login-container {
    max-width: 800px;
    margin: 80px auto;
    padding: 40px;
    border: 1px solid #ccc;
    border-radius: 12px;
    background-color: #fefefe;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
  }

  .login-container h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 26px;
    color: #333;
  }

  .login-container label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #444;
  }

  .login-container input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 20px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
  }

  .login-container .errorlist {
    color: #c00;
    font-size: 14px;
    margin: -10px 0 10px;
    list-style: none;
    padding-left: 0;
  }

  .login-container button {
    width: 100%;
    padding: 12px;
    background-color: #2a7ae2;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .login-container button:hover {
    background-color: #1e5bb8;
  }
</style>

<div class="login-container">
  <h2>Вход</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}

    <button type="submit">Войти</button>
  </form>
</div>
{% endblock %}
